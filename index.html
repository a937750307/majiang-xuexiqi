<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻将学习器 · 边打边学</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">麻将学习器</div>
  <div class="top-actions">
    <a class="link-btn" href="regions.html">规则</a>
    <button class="solid-btn" id="new-btn">新开一局</button>
  </div>
</header>

<main class="layout">
  <section class="board-area">
    <div class="board">
      <div class="seat seat-top" id="seat-2"></div>
      <div class="seat seat-left" id="seat-3"></div>
      <div class="center" id="center"></div>
      <div class="seat seat-right" id="seat-1"></div>
      <div class="seat seat-bottom" id="seat-0"></div>
    </div>
    <div class="action-bar" id="action-bar"></div>
    <details class="panel glossary-panel" open>
      <summary class="panel-title">新手名词解释 <span class="toggle-hint">（点这里收起／展开）</span></summary>
      <details class="term-map" open>
        <summary>一张图看懂术语关系 <span>（点这里收起／展开）</span></summary>
        <div class="term-map-figure"><img src="term-map.svg" alt="麻将术语关系图：牌型构成、鸣牌动作与和牌状态"></div>
      </details>
      <div class="panel-body" id="glossary-body"></div>
    </details>
  </section>

  <aside class="side">
    <section class="panel" id="coach-panel">
      <div class="panel-title coach-title">
        <span>出牌建议</span>
        <button class="hint-toggle" id="hint-btn">提示 · 开</button>
      </div>
      <div class="panel-body" id="coach-body"></div>
    </section>
    <section class="panel">
      <div class="panel-title">对局记录</div>
      <div class="panel-body log" id="log-body"></div>
    </section>
  </aside>
</main>

<footer class="site-footer">
  <p class="footer-note">本站内容仅供学习和交流，非商业用途</p>
  <a class="footer-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2025187466号</a>
  <a class="footer-link footer-police" href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=33030402001483" target="_blank" rel="noopener"><img src="https://www.937788.xyz/gonganbeian.png" alt="公安备案"><span>浙公网安备33030402001483号</span></a>
</footer>

<div class="overlay hidden" id="overlay"><div class="dialog" id="dialog"></div></div>

<script src="mahjong.js"></script>
<script src="app.js"></script>
</body>
</html>
