<svg viewBox="0 0 680 470" width="100%" style="height:auto" role="img" xmlns="http://www.w3.org/2000/svg">
<title>麻将核心术语关系图</title>
<desc>展示牌型构成、四种鸣牌动作与和牌状态的术语关系</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#1b1b1b">麻将术语速览</text>

<rect x="40" y="56" width="600" height="150" rx="16" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="60" y="80" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C">一手和牌 = 4 组面子 + 1 对将</text>

<rect x="60" y="96" width="160" height="48" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">顺子</text>
<text x="140" y="132" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">同花色连续三张</text>

<rect x="240" y="96" width="160" height="48" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">刻子</text>
<text x="320" y="132" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">三张完全一样</text>

<rect x="420" y="96" width="200" height="48" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="520" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">将（雀头）</text>
<text x="520" y="132" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">一对相同的牌</text>

<text x="60" y="172" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">特殊和牌型：七对 = 七个对子，不受四组面子限制</text>
<text x="60" y="192" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5">听牌 = 差一张就成和牌；向听 = 距离听牌还差几步</text>

<text x="40" y="242" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#1b1b1b">别人打出牌时，你可以选择</text>

<rect x="40" y="258" width="140" height="62" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="110" y="278" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">吃</text>
<text x="110" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">仅上家</text>
<text x="110" y="313" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">组成顺子</text>

<rect x="194" y="258" width="140" height="62" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="264" y="278" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">碰</text>
<text x="264" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">手牌有两张</text>
<text x="264" y="313" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">组成刻子</text>

<rect x="348" y="258" width="140" height="62" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="418" y="278" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">杠</text>
<text x="418" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">手牌有三张</text>
<text x="418" y="313" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">补一张牌</text>

<rect x="502" y="258" width="138" height="62" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="571" y="278" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">和（胡）</text>
<text x="571" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">牌型成立</text>
<text x="571" y="313" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">赢得本局</text>

<path d="M110 320 L110 348" class="arr" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M264 320 L264 348" class="arr" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M418 320 L418 348" class="arr" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="352" width="540" height="44" rx="8" fill="#f6f6f4" stroke="#d8d8d2" stroke-width="0.5"/>
<text x="310" y="374" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" dominant-baseline="central">鸣牌后由你直接出一张牌，不摸牌</text>

<text x="40" y="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7a7a76">优先级：和 &gt; 碰／杠 &gt; 吃　·　上家 = 你左手边那家</text>
<text x="40" y="450" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7a7a76">自摸 = 自己摸到和牌张　·　点炮 = 和别人打出的牌　·　门清 = 全程未吃碰杠</text>
</svg>